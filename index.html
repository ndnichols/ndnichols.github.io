<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nate Nichols</title>
  <meta name="description" content="Nate Nichols — AI, AI safety, and explaining both to normal people. Site coming soon.">
  <style>
    :root { --bg: #faf8f5; --fg: #1f1d1a; --muted: #6b665e; --accent: #b4532a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #ece8e1; --muted: #9a948a; --accent: #e07a4f; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 18px/1.5 Georgia, "Times New Roman", serif;
      padding: 24px;
    }
    main { max-width: 32rem; }
    h1 { font-size: 2.4rem; font-weight: normal; letter-spacing: -0.01em; }
    p { color: var(--muted); margin-top: 0.75rem; }
    .dot { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Nate Nichols<span class="dot">.</span></h1>
    <p>Site coming soon. Workshops, talks, writing, and the Kitchen Table podcast will live here.</p>
  </main>
</body>
</html>
